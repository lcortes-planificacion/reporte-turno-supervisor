    <!-- cuerpo de la hoja -->
    <rect x="146" y="130" width="220" height="268" rx="20" fill="#F1F5F9"/>
    <!-- pinza superior -->
    <rect x="212" y="106" width="88" height="46" rx="14" fill="#E0A245"/>
    <rect x="228" y="94" width="56" height="30" rx="12" fill="#E0A245"/>

